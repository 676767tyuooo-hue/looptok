<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>LoopTok</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b0b10"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--ac:#ff2d75;--bg:#0b0b10;--fg:#fff;--card:#1a1a24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-t=light]{--bg:#fff;--fg:#111;--card:#eee}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column}#main{flex:1;overflow:hidden;position:relative}
.nav{display:flex;justify-content:space-around;padding:6px;border-top:1px solid #8883}
.nav button{background:none;border:0;color:var(--fg);font-size:22px;padding:6px 10px}
.nav .plus{background:linear-gradient(135deg,#25f4ee,var(--ac));border-radius:12px;color:#fff;font-weight:700;padding:6px 18px}
.feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory}
.item{height:100%;scroll-snap-align:start;position:relative;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.item video,.item img{width:100%;height:100%;object-fit:cover}
.tx{padding:30px;font-size:26px;font-weight:800;text-align:center;color:#fff;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#7b2ff7,#f107a3,#25f4ee)}
.info{position:absolute;left:12px;bottom:14px;right:80px;color:#fff;text-shadow:0 1px 4px #000}
.side{position:absolute;right:8px;bottom:20px;display:flex;flex-direction:column;gap:10px;align-items:center;color:#fff}
.side button{background:#0008;border:0;color:#fff;border-radius:50%;width:46px;height:46px;font-size:20px}
.pg{height:100%;overflow:auto;padding:14px}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #8886;background:var(--card);color:var(--fg);margin:5px 0;font-size:16px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:600;margin:3px;display:inline-block}
.btn.g{background:var(--card);color:var(--fg)}.row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--card);border-radius:12px;margin:6px 0;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.grid>*{aspect-ratio:9/16;background:#000;object-fit:cover;width:100%;font-size:11px;color:#fff;overflow:hidden}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:9}
#modal>div{background:var(--bg);width:100%;max-height:80%;overflow:auto;padding:16px;border-radius:18px 18px 0 0}
.badge{font-size:11px;background:var(--ac);color:#fff;border-radius:8px;padding:1px 6px;margin-left:4px}
.msg{max-width:78%;padding:8px 12px;border-radius:14px;margin:4px 0;background:var(--card)}.msg.me{background:var(--ac);color:#fff;margin-left:auto}
.err{color:#ff5470;font-size:14px}
</style></head><body><div id="app"><div id="main"></div><div class="nav" id="nav"></div></div><div id="modal" onclick="if(event.target===this)cm()"><div id="mb"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ====== ВСТАВЬ СВОИ ДАННЫЕ (см. ИНСТРУКЦИЯ.md) ====== */
const CFG={apiKey:"AIzaSyAE6Yh5YRKLQrpo3x-XfqInWEtkm8s2kZI",authDomain:"looptok-47077.firebaseapp.com",projectId:"looptok-47077",appId:"1:757170876266:web:217b52105d6ad4a1fdff13"};
const CLOUD="g50m8s21",PRESET="looptok";
/* ===================================================== */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
firebase.initializeApp(CFG);const auth=firebase.auth(),db=firebase.firestore(),FV=firebase.firestore.FieldValue;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null,U={},P=[],view='home',arg=null,ready=0,lastSt=null,unsubs=[],vs=null,cs=null,S={ac:'#ff2d75',theme:'dark'};
try{S=JSON.parse(localStorage.getItem('lts'))||S}catch(e){}
const M=()=>U[me],isA=u=>u&&(u.admin||u.jr),SB='Поддержал разработку 💎';
const GR={'Закат':'linear-gradient(90deg,#f7971e,#ff2d75)','Океан':'linear-gradient(90deg,#25f4ee,#4361ee)','Неон':'linear-gradient(90deg,#b5ff00,#00e5ff)','Космос':'linear-gradient(90deg,#7b2ff7,#f107a3)'};
const IC=['😎','🔥','💎','👑','🐱','🦊','🍞','⚡','🌈','👻','🦄','🚀'];
const PR={s:25000,i:30000,g:50000,p:75000,a:100000},ON={s:'«Поддержал разработку»',i:'иконку у ника',g:'градиент на ник',p:'набор (иконка+градиент+мл.админ)',a:'админку'};
const fc=id=>U[id].fol||Object.values(U).filter(x=>(x.following||[]).includes(id)).length;
function nm(id){const u=U[id];if(!u)return'?';const s=u.grad&&GR[u.grad]?`background:${GR[u.grad]};-webkit-background-clip:text;color:transparent;font-weight:700`:'';return(u.ico?esc(u.ico)+' ':'')+`<span style="${s}">@${esc(u.name)}</span>`+(u.badges||[]).map(b=>`<span class="badge">${esc(b)}</span>`).join('')+(u.admin?'<span class="badge">ADMIN</span>':u.jr?'<span class="badge">мл.админ</span>':'')}
function om(h){$('#mb').innerHTML=h;$('#modal').style.display='flex'}function cm(){cs&&cs();cs=null;$('#modal').style.display='none';$('#mb').innerHTML=''}
function sub(f){vs&&vs();vs=f}
function go(v,a){cm();vs&&vs();vs=null;view=v;arg=a;render()}
function soft(){const st=!!U[me];if(!ready){ready=1;lastSt=st;return render()}if(st!=lastSt){lastSt=st;return render()}
 if(['home','chat','search','add','inbox'].includes(view)||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;render()}
auth.onAuthStateChanged(u=>{unsubs.forEach(f=>f());unsubs=[];me=u?u.uid:null;U={};P=[];ready=0;if(!u)return render();
 unsubs.push(db.collection('users').onSnapshot(s=>{U={};s.forEach(d=>U[d.id]={id:d.id,...d.data()});soft()},e=>alert('Ошибка базы: '+e.message)));
 unsubs.push(db.collection('posts').orderBy('ts','desc').limit(100).onSnapshot(s=>{const o=P.map(p=>p.id).join();P=s.docs.map(d=>({id:d.id,...d.data()}));if(view=='home'&&o&&o==P.map(p=>p.id).join())patch();else if(view=='home'&&ready)render()}))});
function patch(){P.forEach(p=>{const b=$('#l'+p.id);if(b)b.innerHTML=(p.likes.includes(me)?'❤️':'🤍')+'<br><small>'+p.likes.length+'</small>'})}
function render(){document.documentElement.style.setProperty('--ac',S.ac);document.documentElement.dataset.t=S.theme;const m=$('#main'),nav=$('#nav');
 if(!me){nav.style.display='none';return login(m)}
 if(!ready)return m.innerHTML='<div class="pg">Загрузка…</div>';
 if(!M()){nav.style.display='none';return nameScr(m)}
 if(M().banned){nav.style.display='none';m.innerHTML='<div class="pg"><h2>🚫 Аккаунт заблокирован</h2><button class="btn" onclick="auth.signOut()">Выйти</button></div>';return}
 nav.style.display='flex';nav.innerHTML=[['home','🏠'],['search','🔍'],['add','＋'],['inbox','💬'],['me','👤']].map(([v,i])=>`<button class="${v=='add'?'plus':''}" onclick="go('${v}')">${i}</button>`).join('');
 ({home,search,add,inbox,chat,me:()=>prof(me),user:()=>prof(arg),settings,shop,admin,orders})[view](m)}
function login(m){m.innerHTML=`<div class="pg"><h1 style="font-size:38px;margin:30px 0 4px">🌀 LoopTok</h1><p>Смотри, снимай, общайся.</p><button class="btn" onclick="gl()">G Войти через Google</button><div class="err" id="er"></div></div>`}
function gl(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>$('#er').textContent=e.message)}
function nameScr(m){m.innerHTML=`<div class="pg"><h2>Выбери юзернейм</h2><input id="u" placeholder="латиница, цифры, _ (3–20)" autocapitalize="none"><div class="err" id="er"></div><button class="btn" onclick="mk()">Готово</button><button class="btn g" onclick="auth.signOut()">Выйти</button></div>`}
async function mk(){const n=$('#u').value.trim();if(!/^[A-Za-z0-9_.]{3,20}$/.test(n))return $('#er').textContent='Только латиница, цифры, _ и . (3–20 символов)';
 const b=db.batch();b.set(db.doc('names/'+n.toLowerCase()),{uid:me});b.set(db.doc('users/'+me),{name:n,photo:auth.currentUser.photoURL||'',admin:false,jr:false,banned:false,coins:100,badges:[],following:[]});
 try{await b.commit()}catch(e){$('#er').textContent='Ник занят или ошибка'}}
function home(m){const ps=[...P].sort((a,b)=>(U[b.uid]?.promo?1:0)-(U[a.uid]?.promo?1:0)||b.ts-a.ts);
 m.innerHTML=ps.length?`<div class="feed">${ps.map(item).join('')}</div>`:`<div class="pg" style="text-align:center;margin-top:30%"><h2>Пока пусто 🌱</h2><p>Нажми ＋ и выложи первое видео!</p></div>`;
 const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video');if(v)e.isIntersecting?v.play().catch(()=>{}):v.pause()}),{threshold:.7});document.querySelectorAll('.item').forEach(i=>io.observe(i))}
function item(p){const med=p.type=='video'?`<video src="${esc(p.src)}" loop playsinline onclick="this.paused?this.play():this.pause()"></video>`:p.type=='photo'?`<img src="${esc(p.src)}">`:`<div class="tx">${esc(p.text)}</div>`;
 return `<div class="item">${med}<div class="info"><b onclick="go('user','${p.uid}')">${nm(p.uid)}</b><div>${p.type!='text'?esc(p.text||''):''}</div></div>
<div class="side"><button id="l${p.id}" onclick="lk('${p.id}')">${p.likes.includes(me)?'❤️':'🤍'}<br><small>${p.likes.length}</small></button><button onclick="cmt('${p.id}')">💬</button>${isA(M())||p.uid==me?`<button onclick="del('${p.id}')">🗑</button>`:''}</div></div>`}
function lk(id){const p=P.find(x=>x.id==id);db.doc('posts/'+id).update({likes:p.likes.includes(me)?FV.arrayRemove(me):FV.arrayUnion(me)})}
function del(id){if(confirm('Удалить?'))db.doc('posts/'+id).delete().then(()=>{P=P.filter(p=>p.id!=id);render()})}
function cmt(id){om(`<h3>Комментарии</h3><div id="cl"></div><input id="ci" placeholder="Комментарий..." onkeydown="if(event.key=='Enter')sc('${id}')"><button class="btn" onclick="sc('${id}')">Отправить</button>`);
 cs=db.collection('posts/'+id+'/c').orderBy('ts').onSnapshot(s=>{const b=$('#cl');if(b)b.innerHTML=s.docs.map(d=>{const c=d.data();return `<div class="row"><div>${nm(c.uid)}<br>${esc(c.t)}</div></div>`}).join('')||'<small>Пока нет</small>'})}
function sc(id){const t=$('#ci').value.trim();if(!t)return;$('#ci').value='';db.collection('posts/'+id+'/c').add({uid:me,t,ts:Date.now()})}
function search(m){m.innerHTML=`<div class="pg"><input placeholder="Поиск по юзернейму..." oninput="sq(this.value)"><div id="r"></div></div>`}
function sq(q){q=q.toLowerCase();$('#r').innerHTML=q?Object.values(U).filter(u=>u.name.toLowerCase().includes(q)).map(u=>`<div class="row" onclick="go('user','${u.id}')">${nm(u.id)} <small>${fc(u.id)} подп.</small></div>`).join('')||'Не найдено':''}
function add(m){m.innerHTML=`<div class="pg"><h2>Создать</h2><label class="btn">📷 Снять / выбрать фото или видео<input type="file" accept="image/*,video/*" hidden onchange="pub(this.files[0].type.startsWith('video')?'video':'photo',this.files[0])"></label>
<h3>Текст → пост</h3><textarea id="tt" rows="3" placeholder="Напиши текст"></textarea><button class="btn" onclick="pub('text')">✨ Создать</button><h3>Подпись</h3><input id="cap" placeholder="Подпись к фото/видео"><div id="st"></div></div>`}
async function up(f){const fd=new FormData();fd.append('file',f);fd.append('upload_preset',PRESET);const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/auto/upload`,{method:'POST',body:fd}),j=await r.json();if(!j.secure_url)throw 0;return j.secure_url}
async function pub(type,f){const text=type=='text'?$('#tt').value.trim():$('#cap').value;if(type=='text'&&!text)return;$('#st').textContent='Загрузка…';
 try{const src=f?await up(f):'';await db.collection('posts').add({uid:me,type,src,text,likes:[],ts:Date.now()});go('home')}catch(e){$('#st').textContent='Ошибка загрузки (проверь Cloudinary)'}}
function prof(id){const u=U[id];if(!u)return go('home');const mine=id==me,f=(M().following||[]).includes(id),ps=P.filter(p=>p.uid==id);
 $('#main').innerHTML=`<div class="pg" style="text-align:center">${mine?'<button class="btn g" style="float:right" onclick="go(\'settings\')">⚙</button><button class="btn g" style="float:right" onclick="go(\'shop\')">🛒</button>':'<button class="btn g" style="float:left" onclick="go(\'home\')">←</button>'}
${u.photo?`<img src="${esc(u.photo)}" style="width:70px;height:70px;border-radius:50%">`:'<div style="font-size:60px">👤</div>'}<h2>${nm(id)}</h2><p>👥 ${fc(id)} · подписок ${(u.following||[]).length} · ❤️ ${ps.reduce((a,p)=>a+p.likes.length,0)}${mine?` · 🪙 ${u.coins}`:''}</p>
${mine?'':`<button class="btn" onclick="fw('${id}')">${f?'Отписаться':'Подписаться'}</button><button class="btn g" onclick="go('chat','${id}')">Написать</button>`}
<div class="grid">${ps.map(p=>p.type=='video'?`<video src="${esc(p.src)}" muted onclick="go('home')"></video>`:p.type=='photo'?`<img src="${esc(p.src)}">`:`<div>${esc(p.text)}</div>`).join('')}</div></div>`}
function fw(id){const f=(M().following||[]).includes(id);db.doc('users/'+me).update({following:f?FV.arrayRemove(id):FV.arrayUnion(id)})}
async function inbox(m){m.innerHTML='<div class="pg"><h2>Сообщения</h2><div id="il">Загрузка…</div></div>';
 const s=await db.collection('chats').where('users','array-contains',me).get();$('#il').innerHTML=s.docs.map(d=>d.data()).sort((a,b)=>b.ts-a.ts).map(c=>{const o=c.users.find(x=>x!=me);return `<div class="row" onclick="go('chat','${o}')">${nm(o)} <small>${esc(c.last)}</small></div>`}).join('')||'<p>Найди друга в поиске и напиши ему.</p>'}
function chat(m){const id=[me,arg].sort().join('_');
 m.innerHTML=`<div class="pg" style="display:flex;flex-direction:column"><div><button class="btn g" onclick="go('inbox')">←</button> ${nm(arg)}</div><div id="ms" style="flex:1;overflow:auto"></div><div style="display:flex;gap:6px"><input id="mi" placeholder="Сообщение" onkeydown="if(event.key=='Enter')sm('${id}')"><button class="btn" onclick="sm('${id}')">➤</button></div></div>`;
 sub(db.collection('chats/'+id+'/m').orderBy('ts').limitToLast(100).onSnapshot(s=>{const b=$('#ms');if(!b)return;b.innerHTML=s.docs.map(d=>{const x=d.data();return `<div class="msg ${x.f==me?'me':''}">${esc(x.t)}</div>`}).join('');b.scrollTop=1e9}))}
function sm(id){const t=$('#mi').value.trim();if(!t)return;$('#mi').value='';const ts=Date.now();db.doc('chats/'+id).set({users:[me,arg],last:t.slice(0,40),ts},{merge:true}).then(()=>db.collection('chats/'+id+'/m').add({f:me,t,ts}))}
function settings(m){const u=M();m.innerHTML=`<div class="pg"><button class="btn g" onclick="go('me')">←</button><h2>Настройки</h2><h3>Тема</h3><input type="color" value="${S.ac}" onchange="S.ac=this.value;sv()"><select onchange="S.theme=this.value;sv()"><option value="dark" ${S.theme=='dark'?'selected':''}>Тёмная</option><option value="light" ${S.theme=='light'?'selected':''}>Светлая</option></select>
${u.admin||u.okG?`<h3>Мой градиент</h3>${Object.keys(GR).map(g=>`<button class="btn" style="background:${GR[g]}" onclick="db.doc('users/${me}').update({grad:'${g}'})">${g}</button>`).join('')}<button class="btn g" onclick="db.doc('users/${me}').update({grad:null})">Без</button>`:''}
${u.admin||u.okI?`<h3>Моя иконка</h3>${IC.map(i=>`<button class="btn g" onclick="db.doc('users/${me}').update({ico:'${i}'})">${i}</button>`).join('')}<button class="btn g" onclick="db.doc('users/${me}').update({ico:''})">Нет</button>`:''}
${isA(u)?'<h3>Админ</h3><button class="btn" onclick="go(\'admin\')">🛡 Пользователи</button><button class="btn" onclick="go(\'orders\')">🔔 Заказы</button>':''}
<h3>Разработчики</h3><p>by хлеб и Denis</p><button class="btn g" onclick="auth.signOut()">Выйти</button></div>`}
function sv(){localStorage.setItem('lts',JSON.stringify(S));render()}
function shop(m){const u=M();m.innerHTML=`<div class="pg"><button class="btn g" onclick="go('me')">←</button><h2>Магазин 🪙 ${u.coins}</h2><p><small>Заказ уходит админу, он выдаёт товар вручную.</small></p>`+Object.keys(PR).map(t=>`<div class="row">${ON[t]} — ${PR[t]}<button class="btn" onclick="buy('${t}')">Заказать</button></div>`).join('')+'</div>'}
async function buy(t){if(M().coins<PR[t])return alert('Не хватает монет');try{await db.collection('orders').add({uid:me,t,p:PR[t],st:'wait',ts:Date.now()});alert('✅ Заказ отправлен админу')}catch(e){alert('Ошибка')}}
async function orders(m){m.innerHTML='<div class="pg"><button class="btn g" onclick="go(\'settings\')">←</button><h2>🔔 Заказы</h2><div id="ol">Загрузка…</div></div>';
 const s=await db.collection('orders').where('st','==','wait').get();$('#ol').innerHTML=s.docs.map(d=>{const o=d.data();return `<div class="row">${nm(o.uid)} хочет ${ON[o.t]} (${o.p})<button class="btn" onclick="oa('${d.id}',1)">✅</button><button class="btn g" onclick="oa('${d.id}',0)">❌</button></div>`}).join('')||'Новых нет'}
async function oa(id,ok){const o=(await db.doc('orders/'+id).get()).data(),b=db.batch(),r=db.doc('users/'+o.uid);
 if(ok){const g={s:{badges:FV.arrayUnion(SB)},i:{okI:true},g:{okG:true},p:{okI:true,okG:true,jr:true},a:{admin:true}}[o.t];b.update(r,{...g,coins:FV.increment(-o.p)})}
 b.update(db.doc('orders/'+id),{st:ok?'ok':'no'});await b.commit();orders($('#main'))}
function admin(m){m.innerHTML=`<div class="pg"><button class="btn g" onclick="go('settings')">←</button><h2>🛡 Пользователи</h2>${Object.values(U).map(u=>`<div class="row">${nm(u.id)}<div>${['ban:'+(u.banned?'Разбан':'Бан'),'adm:'+(u.admin?'Снять админа':'Админ'),'jr:Мл.админ','ren:Ник','fol:Подписчики','coin:Монеты','sup:Значок','pro:Продвижение'].map(x=>{const[a,l]=x.split(':');return `<button class="btn g" onclick="ad('${a}','${u.id}')">${l}</button>`}).join('')}</div></div>`).join('')}</div>`}
async function ad(a,id){const u=U[id],r=db.doc('users/'+id);
 if(a=='ban'){if(u.admin)return alert('Сначала сними админку');return r.update({banned:!u.banned})}
 if(a=='adm'){if(id==me)return alert('Себя нельзя');return r.update({admin:!u.admin})}
 if(a=='jr')return r.update({jr:!u.jr});if(a=='pro')return r.update({promo:!u.promo});
 if(a=='sup')return r.update({badges:(u.badges||[]).includes(SB)?FV.arrayRemove(SB):FV.arrayUnion(SB)});
 if(a=='fol'){const v=prompt('Сколько подписчиков?',fc(id));if(v!==null)r.update({fol:Math.max(0,+v||0)})}
 if(a=='coin'){const v=prompt('Сколько монет?',u.coins);if(v!==null)r.update({coins:+v||0})}
 if(a=='ren'){const v=prompt('Новый ник (любой)',u.name);if(!v||v==u.name)return;const b=db.batch();b.delete(db.doc('names/'+u.name.toLowerCase()));b.set(db.doc('names/'+v.toLowerCase()),{uid:id});b.update(r,{name:v});b.commit().catch(()=>alert('Ошибка'))}}
</script></body></html>
